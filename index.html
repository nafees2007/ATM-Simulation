<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Neon ATM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Futuristic Look -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Ambient Background Glow -->
<div class="bg-glow"></div>

<div class="atm-machine">
    
    <!-- Bank Header -->
    <div class="bank-header">
        <i class="fa-solid fa-building-columns"></i> NEXUS SECURE BANK
    </div>

    <!-- LOGIN SECTION -->
    <div id="login-section" class="fade-in">
        <div class="atm-screen mb-4">
            <div class="screen-message" id="login-msg">
                INITIALIZING SYSTEM...<br><br>
                Please insert card details.
            </div>
        </div>
        
        <div class="login-form">
            <div class="input-group-custom">
                <i class="fa-solid fa-credit-card input-icon"></i>
                <input type="text" id="card-number" class="neon-input" placeholder="Card Number (e.g. 1234)" maxlength="16" autocomplete="off">
            </div>
            <div class="input-group-custom mt-3">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="pin-number" class="neon-input" placeholder="4-Digit PIN (e.g. 0000)" maxlength="4" autocomplete="off">
            </div>
            <button class="auth-btn mt-4 w-100" onclick="attemptLogin()" id="login-btn">
                <span>SECURE LOGIN</span> <i class="fa-solid fa-fingerprint"></i>
            </button>
        </div>
    </div>

    <!-- DASHBOARD SECTION (Hidden by default) -->
    <div id="dashboard-section" style="display: none;" class="fade-in">
        <!-- ATM Screen Area -->
        <div class="atm-screen" id="atm-screen">
            <div class="screen-scanline"></div>
            <div class="screen-message" id="screen-message">WELCOME, CERO<br>Select Transaction</div>
            <div class="screen-input-display" id="screen-input"></div>
        </div>

        <div class="row mt-4">
            <!-- Left Side: Features -->
            <div class="col-md-5 action-panel">
                <button class="action-btn" onclick="selectAction('withdraw')"><i class="fa-solid fa-money-bill-wave"></i> Withdrawal</button>
                <button class="action-btn" onclick="selectAction('deposit')"><i class="fa-solid fa-hand-holding-dollar"></i> Deposit</button>
                <button class="action-btn" onclick="selectAction('balance')"><i class="fa-solid fa-scale-balanced"></i> Balance</button>
                <button class="action-btn" onclick="selectAction('statement')"><i class="fa-solid fa-file-invoice-dollar"></i> Statement</button>
                <button class="action-btn" onclick="selectAction('pin')"><i class="fa-solid fa-key"></i> PIN Change</button>
                <button class="action-btn btn-cancel mt-2" onclick="logout()"><i class="fa-solid fa-power-off"></i> EJECT CARD</button>
            </div>

            <!-- Right Side: Numeric Keypad -->
            <div class="col-md-7 keypad-panel">
                <div class="row g-2 mb-2">
                    <div class="col-4"><button class="keypad-btn" onclick="pressKey('1')">1</button></div>
                    <div class="col-4"><button class="keypad-btn" onclick="pressKey('2')">2</button></div>
                    <div class="col-4"><button class="keypad-btn" onclick="pressKey('3')">3</button></div>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-4"><button class="keypad-btn" onclick="pressKey('4')">4</button></div>
                    <div class="col-4"><button class="keypad-btn" onclick="pressKey('5')">5</button></div>
                    <div class="col-4"><button class="keypad-btn" onclick="pressKey('6')">6</button></div>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-4"><button class="keypad-btn" onclick="pressKey('7')">7</button></div>
                    <div class="col-4"><button class="keypad-btn" onclick="pressKey('8')">8</button></div>
                    <div class="col-4"><button class="keypad-btn" onclick="pressKey('9')">9</button></div>
                </div>
                <div class="row g-2">
                    <div class="col-4"><button class="keypad-btn btn-clear" onclick="clearInput()">CLR</button></div>
                    <div class="col-4"><button class="keypad-btn" onclick="pressKey('0')">0</button></div>
                    <div class="col-4"><button class="keypad-btn btn-enter" onclick="submitInput()">ENT</button></div>
                </div>
                <div class="row g-2 mt-2">
                    <div class="col-12"><button class="keypad-btn btn-home" onclick="resetATM()">HOME MENU</button></div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Custom JavaScript -->
<script src="script.js"></script>
</body>
</html>
